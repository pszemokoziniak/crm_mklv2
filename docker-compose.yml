version: '3.3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-app
    container_name: crm-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    env_file: .env
    environment:
      - DB_PORT=3306
    networks:
      - crm-v2-net

  web:
    image: nginx:alpine
    container_name: crm-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - crm-v2-net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: crm-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crm_database
      MYSQL_ROOT_PASSWORD: Mkl_Crm_2026_!_Secure
      MYSQL_PASSWORD: Mkl_Crm_2026_!_Secure
      MYSQL_USER: crm_user
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    env_file: .env
    networks:
      - crm-v2-net

networks:
  crm-v2-net:
    driver: bridge

volumes:
  dbdata:
    driver: local
