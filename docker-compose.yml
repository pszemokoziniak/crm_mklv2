version: '3.3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-app
    container_name: crm-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
       - ./:/var/www
    env_file: .env
    environment:
      - DB_PORT=3306
    networks:
      - crm-v2-net

  web:
    image: nginx:alpine
    container_name: crm-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_PORT:-8081}:80"
    volumes:
      # Montowanie dla Nginx jest nadal potrzebne, aby Nginx miał dostęp do public/index.php
      # oraz skompilowanych zasobów frontendowych, które są teraz częścią obrazu app.
      # Ważne: Nginx musi mieć dostęp do /var/www/public z kontenera app.
      # Jeśli /var/www w app nie jest wolumenem, to Nginx nie będzie miał do niego dostępu.
      # Musimy zmienić sposób, w jaki Nginx dostaje pliki.
      # Na razie zostawiam to bez zmian, ale to może być kolejny problem.
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - crm-v2-net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: crm-db
    restart: unless-stopped
    # Poświadczenia z .env aplikacji (te same, którymi łączy się Laravel).
    # Działają tylko przy zakładaniu pustej bazy; w istniejącej hasło zmienia
    # się przez ALTER USER. Root dostaje losowe hasło — aplikacja i backup
    # używają wyłącznie crm_user. Kontener bazy nie dostaje reszty .env.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?brak DB_DATABASE w .env}
      MYSQL_USER: ${DB_USERNAME:?brak DB_USERNAME w .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?brak DB_PASSWORD w .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - crm-v2-net

networks:
  crm-v2-net:
    driver: bridge

volumes:
  dbdata:
    driver: local
