version: '3.3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-app
    container_name: crm-app
    restart: unless-stopped
    working_dir: /var/www
    # Usunięto montowanie wolumenu, aby skompilowane zasoby z Dockerfile były używane
    # volumes:
    #   - ./:/var/www
    env_file: .env
    environment:
      - DB_PORT=3306
    networks:
      - crm-v2-net

  web:
    image: nginx:alpine
    container_name: crm-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # Montowanie dla Nginx jest nadal potrzebne, aby Nginx miał dostęp do public/index.php
      # oraz skompilowanych zasobów frontendowych, które są teraz częścią obrazu app.
      # Ważne: Nginx musi mieć dostęp do /var/www/public z kontenera app.
      # Jeśli /var/www w app nie jest wolumenem, to Nginx nie będzie miał do niego dostępu.
      # Musimy zmienić sposób, w jaki Nginx dostaje pliki.
      # Na razie zostawiam to bez zmian, ale to może być kolejny problem.
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - crm-v2-net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: crm-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crm_database
      MYSQL_ROOT_PASSWORD: Mkl_Crm_2026_!_Secure
      MYSQL_PASSWORD: Mkl_Crm_2026_!_Secure
      MYSQL_USER: crm_user
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    env_file: .env
    networks:
      - crm-v2-net

networks:
  crm-v2-net:
    driver: bridge

volumes:
  dbdata:
    driver: local
