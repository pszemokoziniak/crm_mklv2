; Obraz php:*-fpm nie ma produkcyjnego php.ini, więc domyślnie display_errors
; jest włączone, a log_errors wyłączone. Ostrzeżenia z kompilacji plików
; (np. thecodingmachine/safe) trafiałyby wtedy na stronę przed nagłówkami.
; Błędy tylko do logu (docker logs crm-app), nigdy na ekran.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
expose_php = Off
