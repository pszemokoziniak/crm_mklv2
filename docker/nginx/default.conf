server {
    listen 80;
    server_name crm.mkl.pl;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Ukryj wersję Nginxa
    server_tokens off;

    root /var/www/public;

    # Blokuj dostęp do plików .env, .git, .htaccess itp.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Blokuj dostęp do plików wrażliwych w katalogu głównym
    location ~ ^/(composer\.json|composer\.lock|package\.json|package-lock\.json|webpack\.mix\.js|phpunit\.xml) {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Dodatkowe nagłówki bezpieczeństwa
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    location /sw.js {
        add_header Service-Worker-Allowed /;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;

        # Dodatkowe nagłówki bezpieczeństwa dla statycznych plików
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
